[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filmengine"
version = "0.1.0"
description = "Prototipo del motore di conversione di negativi fotografati con lo smartphone"
requires-python = ">=3.11"
dependencies = ["numpy", "opencv-python", "rawpy", "imageio", "tifffile"]

[project.optional-dependencies]
dev = ["pytest"]
ai = ["onnxruntime"]

[tool.setuptools]
packages = ["filmengine", "devguide"]

[tool.setuptools.package-data]
filmengine = []

[tool.pytest.ini_options]
testpaths = ["tests"]
